<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Catcher - Report a Ghost</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #1a202c;
    }

    .container {
      background: white;
      min-height: 400px;
      max-height: 600px;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.9;
    }

    .context-info {
      background: #f7fafc;
      padding: 12px 20px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
      color: #4a5568;
    }

    .context-info div {
      margin: 4px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .context-info strong {
      color: #2d3748;
      min-width: 50px;
    }

    .form-container {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group-small {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 13px;
      color: #2d3748;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-group input[type="range"] {
      flex: 1;
    }

    .slider-value {
      background: #2563eb;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      min-width: 40px;
      text-align: center;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #718096;
      margin-top: 4px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .advanced-section {
      border-top: 2px solid #e2e8f0;
      margin-top: 16px;
      padding-top: 16px;
    }

    .advanced-toggle {
      width: 100%;
      padding: 10px;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    .advanced-toggle:hover {
      background: #edf2f7;
    }

    .advanced-toggle .arrow {
      transition: transform 0.2s;
    }

    .advanced-toggle.active .arrow {
      transform: rotate(180deg);
    }

    .advanced-content {
      display: none;
    }

    .advanced-content.show {
      display: block;
    }

    .risk-types {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .risk-checkbox {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .risk-checkbox:hover {
      background: #f7fafc;
    }

    .risk-checkbox input[type="checkbox"] {
      width: auto;
      margin: 0;
    }

    .media-upload {
      margin: 16px 0;
    }

    .upload-area {
      width: 100%;
      padding: 20px;
      background: #f7fafc;
      border: 2px dashed #cbd5e0;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .upload-area:hover {
      background: #edf2f7;
      border-color: #2563eb;
    }

    .upload-area.has-file {
      border-style: solid;
      border-color: #48bb78;
      background: #f0fdf4;
    }

    .media-preview {
      margin-top: 12px;
      display: none;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      position: relative;
    }

    .media-preview.show {
      display: block;
    }

    .media-preview img {
      width: 100%;
      max-height: 120px;
      object-fit: contain;
      background: #f7fafc;
    }

    .remove-media {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #e53e3e;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .remove-media:hover {
      background: #c53030;
    }

    .button-group {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      border-top: 1px solid #e2e8f0;
      background: #f9fafb;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .submit-btn {
      background: #2563eb;
      color: white;
    }

    .submit-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .cancel-btn {
      background: #edf2f7;
      color: #4a5568;
    }

    .cancel-btn:hover {
      background: #e2e8f0;
    }

    .success-view {
      display: none;
      padding: 40px 20px;
      text-align: center;
    }

    .success-view.show {
      display: block;
    }

    .success-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .success-view h2 {
      color: #2d3748;
      margin-bottom: 12px;
      font-size: 22px;
    }

    .ghost-id {
      background: #edf2f7;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-weight: 600;
      color: #2563eb;
      margin: 16px 0;
      font-size: 16px;
    }

    .success-view p {
      color: #4a5568;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .report-another-btn {
      background: #2563eb;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .report-another-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .required {
      color: #e53e3e;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <span>👻</span>
        Ghost Catcher
      </h1>
      <p>Report operational inefficiencies</p>
    </div>

    <div class="context-info">
      <div>
        <strong>📍 Page:</strong>
        <span id="contextUrl">Loading...</span>
      </div>
      <div>
        <strong>🕐 Time:</strong>
        <span id="contextTime">Loading...</span>
      </div>
    </div>

    <div id="formView" class="form-container">
      <form id="ghostForm">
        <div class="form-group">
          <label>Title <span class="required">*</span></label>
          <input
            type="text"
            id="title"
            placeholder="Brief summary of the issue"
            required
          />
        </div>

        <div class="form-group">
          <label>Description <span class="required">*</span></label>
          <textarea
            id="description"
            placeholder="Detailed description of the issue, its impact, and any relevant context..."
            required
          ></textarea>
        </div>

        <div class="grid-2">
          <div class="form-group-small">
            <label>Category <span class="required">*</span></label>
            <select id="category" required>
              <option value="">Select category</option>
              <option value="Process Inefficiency">Process Inefficiency</option>
              <option value="Technical Issue">Technical Issue</option>
              <option value="Communication Gap">Communication Gap</option>
              <option value="Data Quality">Data Quality</option>
              <option value="User Experience">User Experience</option>
              <option value="Compliance Risk">Compliance Risk</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group-small">
            <label>Email <span class="required">*</span></label>
            <input
              type="email"
              id="email"
              placeholder="your.email@company.com"
              required
            />
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group-small">
            <label>Impact (1-5) <span class="required">*</span></label>
            <div class="slider-group">
              <input type="range" id="impact" min="1" max="5" value="3" />
              <div class="slider-value" id="impactValue">3</div>
            </div>
            <div class="slider-labels">
              <span>Low</span>
              <span>High</span>
            </div>
          </div>

          <div class="form-group-small">
            <label>Effort to Fix (1-5)</label>
            <div class="slider-group">
              <input type="range" id="effort" min="1" max="5" value="3" />
              <div class="slider-value" id="effortValue">3</div>
            </div>
            <div class="slider-labels">
              <span>Easy</span>
              <span>Hard</span>
            </div>
          </div>
        </div>

        <div class="advanced-section">
          <button type="button" class="advanced-toggle" id="advancedToggle">
            <span>Advanced Options</span>
            <span class="arrow">▼</span>
          </button>

          <div class="advanced-content" id="advancedContent">
            <div class="grid-2">
              <div class="form-group-small">
                <label>Reporter Name</label>
                <input
                  type="text"
                  id="reporter"
                  placeholder="Your name"
                />
              </div>

              <div class="form-group-small">
                <label>Department</label>
                <select id="department">
                  <option value="">Select department</option>
                  <option value="Engineering">Engineering</option>
                  <option value="Product">Product</option>
                  <option value="Design">Design</option>
                  <option value="Marketing">Marketing</option>
                  <option value="Sales">Sales</option>
                  <option value="Customer Success">Customer Success</option>
                  <option value="Operations">Operations</option>
                  <option value="Finance">Finance</option>
                  <option value="HR">HR</option>
                  <option value="Legal">Legal</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>

            <div class="form-group-small">
              <label>Geography</label>
              <select id="geography">
                <option value="Global">Global</option>
                <option value="North America">North America</option>
                <option value="Europe">Europe</option>
                <option value="Asia Pacific">Asia Pacific</option>
                <option value="Latin America">Latin America</option>
                <option value="Middle East & Africa">Middle East & Africa</option>
              </select>
            </div>

            <div class="form-group-small">
              <label>Risk Type</label>
              <div class="risk-types">
                <label class="risk-checkbox">
                  <input type="checkbox" name="risk" value="Financial" />
                  <span>Financial</span>
                </label>
                <label class="risk-checkbox">
                  <input type="checkbox" name="risk" value="Operational" />
                  <span>Operational</span>
                </label>
                <label class="risk-checkbox">
                  <input type="checkbox" name="risk" value="Compliance" />
                  <span>Compliance</span>
                </label>
                <label class="risk-checkbox">
                  <input type="checkbox" name="risk" value="Reputational" />
                  <span>Reputational</span>
                </label>
                <label class="risk-checkbox">
                  <input type="checkbox" name="risk" value="Strategic" />
                  <span>Strategic</span>
                </label>
              </div>
            </div>

            <div class="form-group-small">
              <label>URL</label>
              <input
                type="text"
                id="url"
                placeholder="https://example.com/page"
              />
            </div>
          </div>
        </div>

        <div class="media-upload">
          <label>Media (Optional)</label>
          <input type="file" id="mediaInput" accept="image/*" style="display: none;" />
          <div class="upload-area" id="uploadArea">
            <div style="font-size: 32px; margin-bottom: 8px;">📎</div>
            <div style="font-size: 13px; font-weight: 600; color: #2563eb;">Click to upload image</div>
            <div style="font-size: 11px; color: #718096; margin-top: 4px;">PNG, JPG up to 10MB</div>
          </div>
          <div class="media-preview" id="mediaPreview">
            <img id="mediaImg" src="" alt="Media preview" />
            <button type="button" class="remove-media" id="removeMediaBtn">Remove</button>
          </div>
        </div>
      </form>
    </div>

    <div class="button-group">
      <button type="button" class="cancel-btn" id="cancelBtn">Cancel</button>
      <button type="submit" form="ghostForm" class="submit-btn" id="submitBtn">Report Ghost</button>
    </div>

    <div id="successView" class="success-view">
      <div class="success-icon">✅</div>
      <h2>Ghost Captured!</h2>
      <div class="ghost-id" id="ghostId">GH-XXXXXX</div>
      <p>Your report has been sent to the operations team.<br>Auto-closing in 3 seconds...</p>
      <button class="report-another-btn" id="reportAnotherBtn">Report Another Ghost</button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
